<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Francisco Bruno — fale comigo pelo MetaWhats." />
  <title>Francisco Bruno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --accent: #25d366;
      --accent-hover: #20bd5a;
      --ring: rgba(37, 211, 102, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.25rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 211, 102, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(37, 211, 102, 0.06), transparent);
    }
    main {
      text-align: center;
      max-width: 28rem;
      animation: fade 0.8s ease-out both;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mark {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      background: linear-gradient(145deg, #25d366 0%, #128c7e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(37, 211, 102, 0.25);
    }
    .mark svg { width: 2.25rem; height: 2.25rem; fill: white; }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    p {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
      padding: 0.9rem 2rem;
      min-width: 12rem;
      font-size: 1rem;
      font-weight: 600;
      color: #052e16;
      background: var(--accent);
      border: none;
      border-radius: 9999px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 24px var(--ring);
    }
    .cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 8px 32px var(--ring);
    }
    .cta:active { transform: translateY(0); }
    footer {
      position: fixed;
      bottom: 1.25rem;
      font-size: 0.75rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/>
      </svg>
    </div>
    <h1>Francisco Bruno</h1>
    <p>Mensagens seguras com identidade MetaMask. Toque abaixo para iniciar uma conversa.</p>
    <a class="cta" href="https://chat.franciscobruno.com">Fale Comigo</a>
  </main>
  <footer>MetaWhats · franciscobruno.com</footer>
</body>
</html>
