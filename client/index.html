<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no, interactive-widget=resizes-content"
  />
  <!--
    CSP defensiva (meta). O cabeçalho HTTP pelo servidor é preferível em produção,
    mas esta meta cobre a maior parte da superfície XSS que pode ser injetada após
    o parsing inicial. 'unsafe-inline' em styles é necessário para Tailwind/Vite e
    para componentes que usam style attributes; mantemos scripts sem 'unsafe-inline'.
    WalletConnect requer ligações a relay.walletconnect.* e verify.walletconnect.*.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' ws: wss: https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://registry.walletconnect.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org;"
  />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>OpenZap</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/pwa-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b141a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body class="bg-whatsapp-dark">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
